# 機器台帳の例。実際の台帳は inventory/devices.yaml (git 管理外) に置く:
#   docker compose run --rm tools init        (対話で作る)
#   または cp inventory/devices.example.yaml inventory/devices.yaml して編集
# 編集後: docker compose run --rm tools targets   (scrape 対象と syslog の送信元対応表を作り直す)
#
#   name:      表示名。Prometheus の instance、Loki の host になる (英小文字・数字・- _)
#   kind:      rtx | wlx | other
#   address:   管理 IP (IPv4) か DNS 名。SNMP の宛先 (host:port でポート指定可、既定 161)。
#              syslog の送信元もこれで照合する (IP は送信元 IP と、DNS 名は送信元の逆引き名と一致させる)
#   snmp_auth: snmp/auths.yml の auth 名。yamaha_v3 (SNMPv3 authPriv、推奨) / yamaha_v2c
#   syslog:    この機器から syslog を受けるか (check の受信待ちの対象)
#   wan_interface: (任意、1 台だけ) WAN 側インターフェースの ifName (例 lan2)。command-center の WAN 表示と
#              アラート WanHighUtilization に使う。書かなければ WAN 表示は「WAN interface not configured」
# 秘密値 (SNMP のパスワード・コミュニティ) はここに書かない。.env に置く。
devices:
  - name: rtx1300
    kind: rtx
    address: 192.168.100.1
    snmp_auth: yamaha_v3
    syslog: true
    wan_interface: lan2
  - name: wlx413
    kind: wlx
    address: 192.168.100.2
    snmp_auth: yamaha_v3
    syslog: true
