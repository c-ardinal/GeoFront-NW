# Update proposals (pull requests) for the pinned images and the workflow actions. Images stay pinned by tag + digest:
# check linux/amd64 + linux/arm64 before merging (README 「更新」, scripts/arm64.sh).
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      all: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/analyzer", "/capture", "/demo-gen", "/flowd", "/mask-api", "/notify-relay", "/testbed", "/tools"]
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      all: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      all: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
