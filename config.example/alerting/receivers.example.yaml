# 送信先の設定例。alerting/receivers.yaml にコピーして編集 (実ファイルは git 管理外)。
#   cp config.example/alerting/receivers.example.yaml "$OBS_CONFIG_DIR/alerting/receivers.yaml"  (従来の配置の場合はリポジトリの alerting/)
#   docker compose run --rm tools targets       (設定を生成し Alertmanager に反映)
#   docker compose run --rm tools notify-test   (各送信先にテスト送信して応答を表で確認)
#
# 秘密値 (Webhook URL・トークン・SMTP パスワード) は本ファイルに記載せず .env に配置 (.env.example の「通知」の節)。
# 秘密値は種類単位で 1 組: メール受信者の複数作成時は同一の SMTP サーバーを使用し、送信先 (to) のみ変更。
# 通知文は日本語。機器名・対象・数値・開始時刻 (JST)・画面へのリンク (OBS_PUBLIC_URL) を含み、IP / MAC はマスク表示。
# 復旧 (resolved) も通知。demo profile では本ファイルは不使用で、外部送信なしのデモ用受信先への記録のみ。

receivers:
  # メール (SMTP)。.env: SMTP_HOST / SMTP_PORT / SMTP_FROM / SMTP_USER / SMTP_PASSWORD / SMTP_TLS (starttls | tls | none)
  - name: mail
    type: email
    to: [admin@example.com]

  # Slack (Incoming Webhook)。.env: SLACK_WEBHOOK_URL
  - name: slack
    type: slack

  # Discord (チャンネルの Webhook)。.env: DISCORD_WEBHOOK_URL
  - name: discord
    type: discord

  # LINE (Messaging API の push メッセージ。LINE Notify は 2025 年に終了済み)。
  # .env: LINE_CHANNEL_ACCESS_TOKEN (チャネルアクセストークン・長期)。to: 送信先のユーザー ID / グループ ID
  # (公式アカウントの友だち追加 / グループへの招待後に設定。ID は LINE Developers コンソールか webhook で確認)
  - name: line
    type: line
    to: U00000000000000000000000000000000

  # 汎用 Webhook (JSON を POST。status / title / text / alerts)。.env: WEBHOOK_URL、任意で WEBHOOK_BEARER_TOKEN
  - name: hook
    type: webhook

# 重大度別の送信先と再通知の間隔 (解消まで、本間隔で同一通知を反復)。
# 未記載の重大度は既定: critical / warning は全送信先、info は通知対象外。
routes:
  critical: {receivers: [mail, line], repeat: 1h}
  warning: {receivers: [slack, discord], repeat: 4h}
  info: {receivers: [], repeat: 24h}

# 集約方法 (任意): 初回通知までの待機時間 / 同一グループへの新規アラート追加時の間隔
timing:
  group_wait: 30s
  group_interval: 5m
