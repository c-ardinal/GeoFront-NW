# 機器台帳の例。実際の台帳は設定ディレクトリ (OBS_CONFIG_DIR) の inventory/devices.yaml に配置 (リポジトリには配置しない):
#   docker compose run --rm tools init        (対話形式で作成)
#   または cp config.example/inventory/devices.example.yaml "$OBS_CONFIG_DIR/inventory/devices.yaml" して編集 (従来の配置の場合はリポジトリの inventory/)
# 編集後: docker compose run --rm tools targets   (scrape 対象と syslog の送信元対応表を再生成)
#
#   name:      表示名。Prometheus の instance、Loki の host に使用 (英小文字・数字・- _)
#   kind:      rtx | wlx | other (drivers/ のドライバ: drivers/yamaha-rtx・drivers/yamaha-wlx・drivers/generic)
#   address:   管理 IP (IPv4) か DNS 名。SNMP の送信先 (host:port でポート指定可、既定 161)。
#              syslog の送信元も本項目で照合 (IP は送信元 IP と、DNS 名は送信元の逆引き名と一致が必要)
#   snmp_auth: snmp/auths.yml の auth 名。yamaha_v3 (SNMPv3 authPriv、推奨) / yamaha_v2c
#   syslog:    本機器からの syslog 受信の有無 (check の受信待機の対象)
#   wan_interface: (任意、1 台のみ) WAN 側インターフェースの ifName (例 lan2)。command-center の WAN 表示と
#              アラート WanHighUtilization に使用。未記載の場合は WAN 表示が「WAN interface not configured」
#              ネットワーク図では本機器の先に「インターネット」を描画
#   parent:    (任意) 本機器の接続先である上位機器の name。ネットワーク図の線に反映 (未記載の場合は「接続先未設定」)
#   parent_if: (任意) 上位機器側インターフェースの ifName (例 lan1)。線の利用率・エラーは本 IF の数値
#   uplink_if: (任意) 本機器側で上位に接続するインターフェースの ifName (parent_if の未記載時は本設定値を線に使用)
#              LLDP (LLDP-MIB) 対応の機器では、取得した隣接も線として追加 (図で「LLDP」と区別)
# 秘密値 (SNMP のパスワード・コミュニティ) は本ファイルに記載禁止。.env に配置。
devices:
  - name: rtx1300
    kind: rtx
    address: 192.168.100.1
    snmp_auth: yamaha_v3
    syslog: true
    wan_interface: lan2
  - name: wlx413
    kind: wlx
    address: 192.168.100.2
    snmp_auth: yamaha_v3
    syslog: true
    parent: rtx1300
    parent_if: lan1
    uplink_if: lan1
