# 機器台帳の例。実際の台帳は設定ディレクトリ (OBS_CONFIG_DIR) の inventory/devices.yaml に置く (リポジトリには置かない):
#   docker compose run --rm tools init        (対話で作る)
#   または cp config.example/inventory/devices.example.yaml "$OBS_CONFIG_DIR/inventory/devices.yaml" して編集 (従来の配置ならリポジトリの inventory/)
# 編集後: docker compose run --rm tools targets   (scrape 対象と syslog の送信元対応表を作り直す)
#
#   name:      表示名。Prometheus の instance、Loki の host になる (英小文字・数字・- _)
#   kind:      rtx | wlx | other (drivers/ のドライバ: drivers/yamaha-rtx・drivers/yamaha-wlx・drivers/generic)
#   address:   管理 IP (IPv4) か DNS 名。SNMP の宛先 (host:port でポート指定可、既定 161)。
#              syslog の送信元もこれで照合する (IP は送信元 IP と、DNS 名は送信元の逆引き名と一致させる)
#   snmp_auth: snmp/auths.yml の auth 名。yamaha_v3 (SNMPv3 authPriv、推奨) / yamaha_v2c
#   syslog:    この機器から syslog を受けるか (check の受信待ちの対象)
#   wan_interface: (任意、1 台だけ) WAN 側インターフェースの ifName (例 lan2)。command-center の WAN 表示と
#              アラート WanHighUtilization に使う。書かなければ WAN 表示は「WAN interface not configured」
#              ネットワーク図ではこの機器の先に「インターネット」を描く
#   parent:    (任意) この機器がつながっている上位の機器の name。ネットワーク図の線になる (書かなければ「接続先未設定」)
#   parent_if: (任意) 上位の機器側のインターフェースの ifName (例 lan1)。線の利用率・エラーはこの IF の値
#   uplink_if: (任意) この機器側の上位につながるインターフェースの ifName (parent_if が無いときはこちらの値を線に使う)
#              LLDP (LLDP-MIB) が取れる機器では、取れた隣接も線として足す (図で「LLDP」と区別)
# 秘密値 (SNMP のパスワード・コミュニティ) はここに書かない。.env に置く。
devices:
  - name: rtx1300
    kind: rtx
    address: 192.168.100.1
    snmp_auth: yamaha_v3
    syslog: true
    wan_interface: lan2
  - name: wlx413
    kind: wlx
    address: 192.168.100.2
    snmp_auth: yamaha_v3
    syslog: true
    parent: rtx1300
    parent_if: lan1
    uplink_if: lan1
