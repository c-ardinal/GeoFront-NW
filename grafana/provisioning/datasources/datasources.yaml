apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      manageAlerts: true
      timeInterval: 30s  # = the scrape interval (prometheus/prometheus.yml): $__rate_interval >= 4 x 30 s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 500
