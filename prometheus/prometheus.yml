global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Standard snmp_exporter pattern. demo-gen impersonates snmp_exporter;
  # to use real devices, point the __address__ replacement at a real snmp_exporter.
  - job_name: snmp
    metrics_path: /snmp
    params:
      module: [if_mib]
    static_configs:
      - targets: [rtx1300, wlx413, wlx222]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: demo-gen:9116

  - job_name: flows
    metrics_path: /flows
    static_configs:
      - targets: [demo-gen:9116]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
