# 30 s (Raspberry Pi default): every rate window in the screens, rules and dashboards is >= 4 intervals (2m)
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# every alert goes to Alertmanager (routing by severity, repeats, silences / ACK); it calls notify-relay
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/obs-generated/prometheus/wan-rules.yml  # WAN utilization alert for the configured WAN interface
  - /etc/obs-generated/prometheus/surge-rules.yml  # host x destination traffic surges (thresholds: SURGE_* in .env)

scrape_configs:
  # Standard snmp_exporter pattern. The targets file is written by the tools container for the active profile:
  #   demo: the drivers' demo devices (drivers/*/demo.json) via demo-gen (which impersonates snmp_exporter, module if_mib);
  #   prod: the inventory via the real snmp-exporter (modules from the device's driver, auth per device).
  # Each target carries __device (-> instance), __exporter (-> __address__) and the module / auth params.
  - job_name: snmp
    metrics_path: /snmp
    scrape_timeout: 14s
    file_sd_configs:
      - files: [/etc/obs-generated/prometheus/snmp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__device]
        target_label: instance
      - source_labels: [__exporter]
        target_label: __address__

  # LLDP neighbours for the network map (P5): the devices of `snmp` whose driver reads LLDP-MIB (drivers/*/driver.yaml
  # lldp; all of today's), module `lldp` (snmp/lldp.yml; demo-gen answers it for the demo), every 2 min (adjacency
  # changes rarely). Read-only like every SNMP request. A device without LLDP-MIB returns no rows; the map then relies
  # on the inventory. Only the neighbour series is kept.
  - job_name: lldp
    metrics_path: /snmp
    scrape_interval: 2m
    scrape_timeout: 14s
    file_sd_configs:
      - files: [/etc/obs-generated/prometheus/lldp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__device]
        target_label: instance
      - source_labels: [__exporter]
        target_label: __address__
      - target_label: __param_module
        replacement: lldp
    metric_relabel_configs:
      - {source_labels: [__name__], regex: lldpRemSysName, action: keep}
      - {regex: lldpRemTimeMark|lldpRemLocalPortNum, action: labeldrop}

  # Flow source, chosen by `tools targets`: flowd (capture profile: real flows + GeoIP, and the capture service's
  # state), flowd-demo (demo: the synthetic pcap replayed), or demo-gen's synthetic counters (DEMO_PCAP_REPLAY=0);
  # empty in prod without capture. flowd targets set __metrics_path__=/metrics. demo-gen's demo_flow_bytes_total is
  # stored as obs_flow_bytes_total, the one name the screens query.
  - job_name: flows
    metrics_path: /flows
    file_sd_configs:
      - files: [/etc/obs-generated/prometheus/flows.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: demo_flow_bytes_total
        target_label: __name__
        replacement: obs_flow_bytes_total

  # Self-monitoring: `up` / scrape_duration_seconds (COLLECTION HEALTH) come with every target; of the components' own
  # thousands of series only the ones the screens read are stored (less TSDB work and disk on a Pi).
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
    metric_relabel_configs:
      - {source_labels: [__name__], regex: prometheus_build_info, action: keep}
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
    metric_relabel_configs:
      - {source_labels: [__name__], regex: loki_distributor_lines_received_total|loki_build_info, action: keep}
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
    metric_relabel_configs:
      - {source_labels: [__name__], regex: loki_source_syslog_entries_total|alloy_build_info, action: keep}
