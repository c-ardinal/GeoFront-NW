groups:
  - name: yamaha-demo
    rules:
      - alert: DeviceDown
        expr: up{job="snmp"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} SNMP scrape failing"

      - alert: WanHighUtilization
        expr: |
          rate(ifHCInOctets{job="snmp",instance="rtx1300",ifName="lan2"}[1m]) * 8
            / (ifHighSpeed{job="snmp",instance="rtx1300",ifName="lan2"} * 1e6) * 100 > 80
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "WAN (rtx1300 lan2) download utilization {{ $value | printf \"%.0f\" }}%"

      - alert: InterfaceErrors
        expr: increase(ifInErrors{job="snmp"}[2m]) + increase(ifOutErrors{job="snmp"}[2m]) > 5
        for: 15s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.ifName }} interface errors increasing"

      - alert: DeviceRebooted
        expr: sysUpTime{job="snmp"} / 100 < 300
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.instance }} restarted (sysUpTime reset, counters discontinuous)"
