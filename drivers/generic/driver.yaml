# Device driver: any device with the standard MIBs (kind `other`). docs/drivers.md: copy this to add a vendor.
name: generic
label: other (standard MIB-II / IF-MIB)
kinds: [other]
snmp_modules: [if_mib, system]
lldp: true
wan: false
wireless_clients: false
