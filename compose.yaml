name: yamaha-observatory-trial

# Profiles (pick one; COMPOSE_PROFILES in .env does the same as --profile):
#   demo     demo-gen: synthetic SNMP / flows / syslog (docker compose --profile demo up -d)
#   prod     real devices: snmp-exporter (SNMPv3) + syslog from the LAN, targets from inventory/devices.yaml
#   testbed  with prod: simulated devices (snmpsim SNMPv3 + syslog sender) to try the prod path without hardware
#            (docker compose --env-file testbed/testbed.env up -d)
#   capture  with prod, off by default: dumpcap ring on a LAN interface (Linux host only) -> flowd -> real flows + GeoIP
#            (.env: COMPOSE_PROFILES=prod,capture, OBS_CAPTURE=1, CAPTURE_IFACE=...; README "パケット取込")
# Shared services (prometheus, loki, alloy, grafana, mask-api, command-center, proxy, alertmanager, notify-relay, analyzer)
# run in every profile. The demo also runs flowd-demo, which replays the synthetic demo/demo-home.pcap as its flows.
# One-shot `demo-setup` / `prod-setup` write the per-profile scrape targets into the `generated` volume first.
# Tools: docker compose run --rm tools <init|check|targets|notify-test|backup|restore|test-syslog|capture|geoip|help>
# Notifications: alerting/receivers.yaml (destinations, routes per severity) + secrets in .env -> the setup step writes the
# Alertmanager config and the notify-relay config (0600) into the `generated` volume. Demo: only the local demo sink.
#
# Images are pinned by tag + digest (multi-arch index: linux/amd64 and linux/arm64 both present).
# Resource limits default to a Raspberry Pi 4 (4 GB); override in .env.

x-ops: &ops
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: "${LOG_MAX_FILE:-3}"

# python:3.12-slim for the self-built images (their Dockerfiles say FROM python:3.12-slim; the named
# build context pins it to this digest)
x-python-base: &python-base
  "python:3.12-slim": docker-image://python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704

x-tools-env: &tools-env
  OBS_BIND: ${OBS_BIND:-127.0.0.1}
  OBS_PORT: ${OBS_PORT:-8080}
  OBS_PUBLIC_URL: ${OBS_PUBLIC_URL:-}
  SYSLOG_BIND: ${SYSLOG_BIND:-127.0.0.1}
  SYSLOG_PORT: ${SYSLOG_PORT:-514}
  OBS_INVENTORY: ${OBS_INVENTORY:-inventory/devices.yaml}
  GF_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
  SNMP_V3_USER: ${SNMP_V3_USER:-}
  SNMP_V3_AUTH_PROTO: ${SNMP_V3_AUTH_PROTO:-SHA}
  SNMP_V3_AUTH_PASS: ${SNMP_V3_AUTH_PASS:-}
  SNMP_V3_PRIV_PROTO: ${SNMP_V3_PRIV_PROTO:-AES}
  SNMP_V3_PRIV_PASS: ${SNMP_V3_PRIV_PASS:-}
  SNMP_COMMUNITY: ${SNMP_COMMUNITY:-}
  OBS_GRAFANA_ANON_ON_LAN: ${OBS_GRAFANA_ANON_ON_LAN:-0}
  OBS_GRAFANA: ${OBS_GRAFANA:-1}
  TZ: ${TZ:-Asia/Tokyo}
  OBS_CAPTURE: ${OBS_CAPTURE:-0}
  DEMO_PCAP_REPLAY: ${DEMO_PCAP_REPLAY:-1}
  CAPTURE_IFACE: ${CAPTURE_IFACE:-}
  CAPTURE_BPF: ${CAPTURE_BPF:-}
  CAPTURE_KEEP_HOURS: ${CAPTURE_KEEP_HOURS:-24}
  PCAP_KEEP_HOURS: ${PCAP_KEEP_HOURS:-24}
  PCAP_UPLOADS_TOTAL_MB: ${PCAP_UPLOADS_TOTAL_MB:-200}

# Notification destinations' settings and secrets: only for the steps that generate the relay config (prod-setup, tools),
# not for the long-running tools services.
x-notify-env: &notify-env
  OBS_RECEIVERS: ${OBS_RECEIVERS:-alerting/receivers.yaml}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_TLS_VERIFY: ${SMTP_TLS_VERIFY:-1}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LINE_API_URL: ${LINE_API_URL:-}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_BEARER_TOKEN: ${WEBHOOK_BEARER_TOKEN:-}

# One image for every tools-based service. Only setup-check (in every profile) and tools (`docker compose run`) build
# it: several services building the same tag in one `up --build` race ("image already exists"); the others use the
# image setup-check has just built and never try to pull it.
x-tools: &tools
  image: ${COMPOSE_PROJECT_NAME:-yamaha-observatory-trial}-tools:local
  pull_policy: never
  environment: *tools-env
  volumes:
    - ./:/work
    - generated:/generated
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: "2"}

x-setup-done: &setup-done
  setup-check: {condition: service_completed_successfully}

# flowd (capture profile) and flowd-demo (demo): capture files -> obs_flow_bytes_total, through the analyzer sandbox
x-flowd: &flowd
  <<: *ops
  build:
    context: ./flowd
    additional_contexts: *python-base
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9100/health', timeout=3)"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 60s
    start_interval: 5s
  mem_limit: ${FLOWD_MEM:-192m}
  cpus: ${FLOWD_CPUS:-0.5}

services:
  # ---- one-shot setup per profile ------------------------------------------------------------
  demo-setup:
    <<: *tools
    profiles: [demo]
    command: [targets, --demo]
    restart: "no"

  prod-setup:
    <<: *tools
    profiles: [prod]
    command: [targets]
    environment:
      <<: [*tools-env, *notify-env]
    restart: "no"

  # every profile: fails `up` with a clear message when no profile (so no setup) was chosen
  setup-check:
    <<: *tools
    build:
      context: ./tools
      additional_contexts:
        repo: ./  # only the files the selftest reads are used (tools/Dockerfile)
    command: [setup-check]
    # also fixes the capture / upload volumes' owner and modes on every start (a volume first created by a tools run is
    # root-owned: mask-api, as nobody, could not write uploads)
    volumes:
      - ./:/work
      - generated:/generated
      - capture-ring:/vol/capture
      - pcap-uploads:/vol/uploads
    depends_on:
      demo-setup: {condition: service_completed_successfully, required: false}
      prod-setup: {condition: service_completed_successfully, required: false}
      capture-setup: {condition: service_completed_successfully, required: false}
    restart: "no"

  # capture profile: .env and profile must agree (OBS_CAPTURE=1, CAPTURE_IFACE); fails `up` with the reason otherwise
  capture-setup:
    <<: *tools
    profiles: [capture]
    command: [capture-setup]
    depends_on:
      prod-setup: {condition: service_completed_successfully, required: false}
    restart: "no"

  # every profile, long-running: checks every OBS_GRAFANA_GUARD_INTERVAL s from the stored hashes (a read-only copy of
  # grafana.db; it never logs in) that no Grafana server admin has a default password (the .env value only applies when
  # Grafana creates its database), and answers the proxy's forward_auth for /grafana/ on a LAN exposure on :8099
  # (internal network only): 200 only after a positive check at most two intervals old. Guard down = Grafana closed.
  # Unhealthy = a LAN exposure is being kept closed (reason in its log). Runs only with Grafana (OBS_GRAFANA).
  grafana-guard:
    <<: *tools
    scale: ${OBS_GRAFANA:-1}
    command: [grafana-guard]
    environment:
      <<: *tools-env
      OBS_GRAFANA_GUARD_INTERVAL: ${OBS_GRAFANA_GUARD_INTERVAL:-60}
    volumes:
      - ./:/work
      - generated:/generated
      - grafana-data:/vol/grafana:ro
    depends_on:
      grafana: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    healthcheck:
      test: ["CMD", "python", "/app/obs.py", "guard-health"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 30s
      start_interval: 5s
    mem_limit: 96m  # peak ~41 MiB measured (sqlite copy + checks): 2x headroom
    cpus: 0.25

  tools:
    <<: *tools
    build:
      context: ./tools
      additional_contexts:
        repo: ./  # only the files the selftest reads are used (tools/Dockerfile)
    pull_policy: build
    profiles: [tools]
    environment:
      <<: [*tools-env, *notify-env]
    volumes:
      - ./:/work
      - generated:/generated
      - prometheus-data:/vol/prometheus
      - loki-data:/vol/loki
      - grafana-data:/vol/grafana
      - alertmanager-data:/vol/alertmanager
      - capture-ring:/vol/capture
      - pcap-uploads:/vol/uploads
      - geoip:/vol/geoip
    restart: "no"

  # ---- demo ---------------------------------------------------------------------------------------
  demo-gen:
    <<: *ops
    profiles: [demo]
    build:
      context: ./demo-gen
      additional_contexts: *python-base
    environment:
      SYSLOG_HOST: alloy
      SYSLOG_PORT: "514"
      DEMO_AUTO_FAULTS: ${DEMO_AUTO_FAULTS:-1}
      DEMO_AUTO_FAULT_INTERVAL: ${DEMO_AUTO_FAULT_INTERVAL:-240}
    ports:
      - "127.0.0.1:9116:9116"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9116/fault/status', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${DEMO_GEN_MEM:-128m}
    cpus: ${DEMO_GEN_CPUS:-0.5}

  # synthetic flows from the bundled synthetic pcap (DEMO_PCAP_REPLAY=1, default), replayed in a loop and scaled up so
  # the globe looks like demo-gen's; its documentation addresses get demo-gen's demo locations (demo/demo-geo.json)
  flowd-demo:
    <<: *flowd
    profiles: [demo]
    environment:
      FLOWD_REPLAY: demo:demo-home.pcap
      FLOWD_REPLAY_SCALE: ${DEMO_PCAP_SCALE:-1500}
      FLOWD_DEMO_GEO: /demo/demo-geo.json
      OBS_LAN_CIDRS: 192.168.100.0/24
    volumes:
      - ./demo:/demo:ro
      - geoip:/geoip:ro
      - generated:/etc/obs-generated:ro
      - analyzer-run:/run/analyzer
    depends_on:
      <<: *setup-done
      analyzer: {condition: service_healthy}

  # ---- prod collectors ----------------------------------------------------------------------------
  snmp-exporter:
    <<: *ops
    profiles: [prod]
    image: prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/obs-generated/snmp/auths.yml
      - --config.expand-environment-variables
    environment:
      SNMP_V3_USER: ${SNMP_V3_USER:-}
      SNMP_V3_AUTH_PASS: ${SNMP_V3_AUTH_PASS:-}
      SNMP_V3_PRIV_PASS: ${SNMP_V3_PRIV_PASS:-}
      # (the v2c community is written into the generated auths.yml: snmp_exporter does not expand it)
    volumes:
      - generated:/etc/obs-generated:ro
    depends_on:
      prod-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9116/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${SNMP_EXPORTER_MEM:-96m}
    cpus: ${SNMP_EXPORTER_CPUS:-0.5}

  # ---- capture (with prod; Linux host only) ---------------------------------------------------------
  # Host network (it must see the LAN interface) with only NET_RAW / NET_ADMIN; read-only root, writes only its ring
  # volume. Exits with the reason (and is not restarted more than 3 times) on Docker Desktop / WSL, a missing
  # interface or a BPF filter that does not compile; status in `tools capture status` and COLLECTION HEALTH.
  capture:
    <<: *ops
    profiles: [capture]
    build:
      context: ./capture
      additional_contexts: *python-base
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=8m]
    restart: on-failure:3
    environment:
      CAPTURE_IFACE: ${CAPTURE_IFACE:-}
      CAPTURE_BPF: ${CAPTURE_BPF:-}
      CAPTURE_SNAPLEN: ${CAPTURE_SNAPLEN:-1514}
      CAPTURE_FILE_MB: ${CAPTURE_FILE_MB:-20}
      CAPTURE_FILES: ${CAPTURE_FILES:-20}
      CAPTURE_FILE_SECONDS: ${CAPTURE_FILE_SECONDS:-60}
      CAPTURE_KEEP_HOURS: ${CAPTURE_KEEP_HOURS:-24}
      CAPTURE_ALLOW_VM: ${CAPTURE_ALLOW_VM:-0}
    volumes:
      - capture-ring:/capture
    depends_on:
      capture-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/capture/status.json')); assert s['running'] and time.time()-s['updated']<30"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s
    mem_limit: ${CAPTURE_MEM:-128m}
    cpus: ${CAPTURE_CPUS:-0.5}

  flowd:
    <<: *flowd
    profiles: [capture]
    environment:
      OBS_LAN_CIDRS: ${OBS_LAN_CIDRS:-}
      FLOWD_DELAY_S: ${FLOWD_DELAY_S:-90}
      FLOWD_RDNS: ${FLOWD_RDNS:-0}
      FLOWD_MAX_SERIES: ${FLOWD_MAX_SERIES:-3000}
    volumes:
      - capture-ring:/capture:ro
      - geoip:/geoip:ro
      - generated:/etc/obs-generated:ro
      - analyzer-run:/run/analyzer
    depends_on:
      <<: *setup-done
      analyzer: {condition: service_healthy}

  # ---- testbed (simulated devices; use with prod) -------------------------------------------------
  testbed-rtx:
    <<: *ops
    profiles: [testbed]
    build:
      context: ./testbed
    container_name: testbed-rtx  # its reverse-DNS name is how Alloy maps its syslog lines to the inventory name
    hostname: testbed-rtx
    environment: &testbed-env
      TB_DEVICE: rtx1300
      SNMP_V3_USER: ${SNMP_V3_USER:-}
      SNMP_V3_AUTH_PASS: ${SNMP_V3_AUTH_PASS:-}
      SNMP_V3_PRIV_PASS: ${SNMP_V3_PRIV_PASS:-}
      SNMP_V3_AUTH_PROTO: ${SNMP_V3_AUTH_PROTO:-SHA}
      SNMP_V3_PRIV_PROTO: ${SNMP_V3_PRIV_PROTO:-AES}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-}  # set: the simulators also answer SNMPv2c with it
      SYSLOG_HOST: alloy
      SYSLOG_PORT: "514"
      SYSLOG_INTERVAL: "5"
    healthcheck: &testbed-health
      test: ["CMD", "python", "device.py", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: 160m
    cpus: 0.5

  testbed-wlx:
    <<: *ops
    profiles: [testbed]
    build:
      context: ./testbed
    container_name: testbed-wlx
    hostname: testbed-wlx
    environment:
      <<: *testbed-env
      TB_DEVICE: wlx413
    healthcheck: *testbed-health
    mem_limit: 160m
    cpus: 0.5

  # synthetic traffic to documentation addresses, for the capture path on a Linux host (capture CAPTURE_IFACE = the
  # compose network's bridge). Nothing answers it.
  testbed-traffic:
    <<: *ops
    profiles: [testbed]
    image: python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
    command: [python, -u, /demo/traffic.py]
    user: nobody
    read_only: true
    volumes:
      - ./demo:/demo:ro
    mem_limit: 48m
    cpus: 0.1

  # mock notification receivers (fake SMTP / Slack / Discord / LINE / webhook): nothing leaves the compose network.
  # testbed/receivers.yaml + the dummy secrets in testbed/testbed.env point every receiver here.
  notifymock:
    <<: *ops
    profiles: [testbed]
    build:
      context: ./testbed
    command: [python, -u, notifymock.py]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: 96m
    cpus: 0.25

  # ---- shared -------------------------------------------------------------------------------------
  prometheus:
    <<: *ops
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-0}
      # snapshot for `tools backup`. Reachable only on the internal network: Prometheus is not published,
      # and the proxy's localhost-only :9090 view refuses /api/v1/admin/*.
      - --web.enable-admin-api
      # /-/reload for `tools targets` (rule files are not watched); internal network only like the admin API
      - --web.enable-lifecycle
      # small host: at most 4 queries evaluated at once (a wallboard poll queues instead of using every core)
      - --query.max-concurrency=4
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - generated:/etc/obs-generated:ro
      - prometheus-data:/prometheus
    depends_on: *setup-done
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    mem_limit: ${PROM_MEM:-512m}  # ~80 MiB measured with 3 devices; compaction of a 30 d TSDB fits
    cpus: ${PROM_CPUS:-1.0}

  loki:
    <<: *ops
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    command: [-config.file=/etc/loki/loki-config.yaml, -config.expand-env=true]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s
    mem_limit: ${LOKI_MEM:-512m}
    cpus: ${LOKI_CPUS:-1.0}

  alloy:
    <<: *ops
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental  # loki.source.syslog syslog_format = "raw"
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      SYSLOG_DROP_UNKNOWN: ${SYSLOG_DROP_UNKNOWN:-0}  # 1 = drop lines from senders that are not in the inventory
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - generated:/etc/obs-generated:ro
    ports:
      # syslog from the devices. Default 127.0.0.1 (nothing from the LAN); set SYSLOG_BIND to the LAN IP to receive.
      - "${SYSLOG_BIND:-127.0.0.1}:${SYSLOG_PORT:-514}:514/udp"
      - "${SYSLOG_BIND:-127.0.0.1}:${SYSLOG_PORT:-514}:514/tcp"
    depends_on:
      <<: *setup-done
      loki: {condition: service_started}
      # Alloy caches the senders' reverse-DNS names: when a testbed device is recreated (new IP), restart Alloy too
      testbed-rtx: {condition: service_started, required: false, restart: true}
      testbed-wlx: {condition: service_started, required: false, restart: true}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${ALLOY_MEM:-256m}
    cpus: ${ALLOY_CPUS:-0.5}

  # Optional: OBS_GRAFANA=0 leaves Grafana (and grafana-guard) out; the command-center does not need it (/grafana/ then
  # answers 502, evidence exports say grafana "unknown"). Raspberry Pi: saves ~100 MB and its background work.
  grafana:
    <<: *ops
    scale: ${OBS_GRAFANA:-1}
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    # Anonymous Viewer (no login) only while the screens are on 127.0.0.1. Published beyond localhost (OBS_BIND) Grafana
    # requires a login, unless OBS_GRAFANA_ANON_ON_LAN=1 opts back in (with a warning): its views are not masked.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export GF_AUTH_ANONYMOUS_ENABLED=true
        case "$$OBS_BIND" in
          127.*|localhost) ;;
          *) if [ "$$OBS_GRAFANA_ANON_ON_LAN" = 1 ]; then
               echo "WARNING: OBS_BIND=$$OBS_BIND and OBS_GRAFANA_ANON_ON_LAN=1 - Grafana is viewable on the LAN WITHOUT login (raw, unmasked values)" >&2
             else
               export GF_AUTH_ANONYMOUS_ENABLED=false
               echo "OBS_BIND=$$OBS_BIND: Grafana anonymous access disabled (login required on the LAN)" >&2
             fi ;;
        esac
        exec /run.sh
    environment:
      OBS_BIND: ${OBS_BIND:-127.0.0.1}
      OBS_GRAFANA_ANON_ON_LAN: ${OBS_GRAFANA_ANON_ON_LAN:-0}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /dashboards/wallboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # small host: no Grafana-side alert evaluation (alerts are Prometheus + Alertmanager), no Live websocket push
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_LOG_LEVEL: warn
      # served by the proxy under /grafana/
      GF_SERVER_ROOT_URL: "${OBS_PUBLIC_URL:-http://127.0.0.1:8080}/grafana/"  # absolute links (share / goto) use it
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s  # first start on a fresh volume runs ~700 DB migrations (2+ min measured, longer on a Pi)
      start_interval: 5s
    mem_limit: ${GRAFANA_MEM:-384m}
    cpus: ${GRAFANA_CPUS:-0.5}

  mask-api:
    <<: *ops
    build:
      context: ./mask-api
      additional_contexts: *python-base
      args:
        # this tool's commit, written into evidence exports: OBS_COMMIT=$(git rev-parse --short HEAD) docker compose build
        OBS_COMMIT: ${OBS_COMMIT:-unknown}
    environment:
      # evidence export (/evidence/): the Loki retention bounds the playback range; GRAFANA_URL for its version
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
      GRAFANA_URL: http://grafana:3000
      # silence / ACK writes (the only writes, /am/...) are allowed while the screens are on 127.0.0.1 only
      OBS_BIND: ${OBS_BIND:-127.0.0.1}
      # 1 = also allow them for X-Obs-Role operator / admin, set by an authentication layer in the proxy (caddy/Caddyfile)
      OBS_OPS_TRUST_ROLE: ${OBS_OPS_TRUST_ROLE:-0}
      OBS_PUBLIC_URL: ${OBS_PUBLIC_URL:-}  # its host is one of the origins allowed to write
      # /pcap/: packet analysis through the analyzer; uploads are the only other writes (same rules as silences)
      PCAP_UPLOAD_MAX_MB: ${PCAP_UPLOAD_MAX_MB:-50}
      PCAP_UPLOADS_TOTAL_MB: ${PCAP_UPLOADS_TOTAL_MB:-200}
      PCAP_KEEP_HOURS: ${PCAP_KEEP_HOURS:-24}
      ANALYZER_TIMEOUT: ${PCAP_ANALYZE_TIMEOUT:-60}
      ANALYZER_VALIDATE_TIMEOUT: ${PCAP_VALIDATE_TIMEOUT:-180}  # an upload is read to its end before it is accepted
      PCAP_READS_PER_MIN: ${PCAP_READS_PER_MIN:-120}
    volumes:
      - capture-ring:/capture:ro
      - pcap-uploads:/uploads
      - ./demo:/demo:ro
      - analyzer-run:/run/analyzer
    depends_on:
      <<: *setup-done
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      analyzer: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${MASK_API_MEM:-320m}
    cpus: ${MASK_API_CPUS:-0.5}

  # Packet analysis sandbox: tshark on the stored capture files, one process per request (time / memory / CPU bounded,
  # at most PCAP_ANALYZE_CONCURRENCY at once). No network at all, read-only root, non-root, capture files read-only;
  # mask-api (and flowd) reach it only through the Unix socket in the analyzer-run tmpfs volume.
  analyzer:
    <<: *ops
    build:
      context: ./analyzer
      additional_contexts:
        <<: *python-base
        demo: ./demo
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    pids_limit: 64
    environment:
      ANALYZER_TIMEOUT: ${PCAP_ANALYZE_TIMEOUT:-60}
      ANALYZER_VALIDATE_TIMEOUT: ${PCAP_VALIDATE_TIMEOUT:-180}  # an upload is read to its end before it is accepted
      ANALYZER_CONCURRENCY: ${PCAP_ANALYZE_CONCURRENCY:-1}
      ANALYZER_PROC_MEM_MB: ${PCAP_ANALYZE_PROC_MB:-384}
      ANALYZER_MAX_ROWS: ${PCAP_MAX_PACKETS:-100000}
    volumes:
      - capture-ring:/capture:ro
      - pcap-uploads:/uploads:ro
      - ./demo:/demo:ro
      - analyzer-run:/run/analyzer
    healthcheck:
      test: ["CMD", "python", "-c", "import analyzer; assert analyzer.call({'op': 'ping'}, timeout=5)['ok']"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${ANALYZER_MEM:-896m}
    cpus: ${ANALYZER_CPUS:-1.0}

  # Alertmanager: every Prometheus alert goes through it (routes per severity, repeats, silences / ACK). Not published:
  # reachable only on the internal network; the screens read it masked and write silences through mask-api (/am/).
  alertmanager:
    <<: *ops
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/obs-generated/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=${ALERTMANAGER_RETENTION:-168h}  # silences and the notification log (an ACK lasts at most 7 d)
      - --cluster.listen-address=  # single instance: no HA gossip port
      - --web.external-url=${OBS_PUBLIC_URL:-http://127.0.0.1:8080}
    volumes:
      - generated:/etc/obs-generated:ro
      - alertmanager-data:/alertmanager
    depends_on: *setup-done
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${ALERTMANAGER_MEM:-64m}
    cpus: ${ALERTMANAGER_CPUS:-0.25}

  # Alertmanager's webhook -> e-mail / Slack / Discord / LINE / webhook (or the demo sink); records every attempt in
  # Loki {job="notify"}. Internal network only. Secrets: the generated relay.json (0600) only.
  notify-relay:
    <<: *ops
    build:
      context: ./notify-relay
      additional_contexts: *python-base
    volumes:
      - generated:/etc/obs-generated:ro
    depends_on:
      <<: *setup-done
      loki: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9095/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${NOTIFY_RELAY_MEM:-64m}
    cpus: ${NOTIFY_RELAY_CPUS:-0.25}

  command-center:
    <<: *ops
    image: nginx:1.29.2-alpine@sha256:61e01287e546aac28a3f56839c136b31f590273f3b41187a36f46f6a03bbfe22
    volumes:
      - ./command-center:/usr/share/nginx/html:ro
      - ./command-center/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [mask-api]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${COMMAND_CENTER_MEM:-64m}
    cpus: ${COMMAND_CENTER_CPUS:-0.25}

  proxy:
    <<: *ops
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      OBS_BIND: ${OBS_BIND:-127.0.0.1}
      OBS_PUBLIC_URL: ${OBS_PUBLIC_URL:-}
      PCAP_UPLOAD_MAX_MB: ${PCAP_UPLOAD_MAX_MB:-50}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$OBS_BIND" in
          127.*|localhost) ;;
          *) echo "WARNING: OBS_BIND=$$OBS_BIND - command-center and Grafana are exposed on the LAN WITHOUT authentication (認証なしで LAN 公開中)" >&2 ;;
        esac
        # Host allowlist of the screens (DNS rebinding, caddy/Caddyfile): loopback names, OBS_PUBLIC_URL's host, the bind address
        hosts="127.0.0.1 localhost [::1] $$(printf '%s' "$$OBS_PUBLIC_URL" | sed -E 's#^[a-zA-Z]+://##; s#^(\[[^]/]*\]).*#\1#; s#^([^[][^:/]*)[:/].*#\1#')"
        case "$$OBS_BIND" in 0.0.0.0|127.*|localhost|'') ;; *) hosts="$$hosts $$OBS_BIND" ;; esac
        export OBS_SITES="$$(for h in $$hosts; do echo "$$h"; done | awk 'NF && !seen[tolower($$0)]++ { printf "%shttp://%s:80", (n++ ? ", " : ""), $$0 }')"
        echo "screens answer for: $$OBS_SITES" >&2
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - generated:/srv/obs-generated:ro
      - caddy-data:/data
    ports:
      - "${OBS_BIND:-127.0.0.1}:${OBS_PORT:-8080}:80"
      - "127.0.0.1:${PROM_LOCAL_PORT:-9090}:9090"
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3000}:3000"
    depends_on:
      command-center: {condition: service_started}
      mask-api: {condition: service_started}
      grafana: {condition: service_started, required: false}  # OBS_GRAFANA=0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${PROXY_MEM:-128m}
    cpus: ${PROXY_CPUS:-0.5}

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alertmanager-data:
  caddy-data:
  generated:
  # packet capture ring (+ status.json) and uploaded pcaps: bounded by their own retention, not in `tools backup`
  # unless --include-captures
  capture-ring:
  pcap-uploads:
  geoip:  # DB-IP Lite City + ASN (tools geoip update)
  # the analyzer's Unix socket: memory only, owned by the analyzer user
  analyzer-run:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0755,size=1m"}
