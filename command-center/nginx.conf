# Static command-center UI + read-only, path-restricted proxy to Prometheus/Loki.
# Upstreams are resolved per request (Docker DNS) so nginx keeps serving while a backend is stopped.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $prom prometheus:9090;
    set $loki loki:3100;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location = /prom/api/v1/query {
        limit_except GET { deny all; }
        proxy_pass http://$prom/api/v1/query$is_args$args;
    }
    location = /prom/api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass http://$prom/api/v1/query_range$is_args$args;
    }
    location = /prom/api/v1/alerts {
        limit_except GET { deny all; }
        proxy_pass http://$prom/api/v1/alerts$is_args$args;
    }
    location = /prom/api/v1/rules {
        limit_except GET { deny all; }
        proxy_pass http://$prom/api/v1/rules$is_args$args;
    }
    location ^~ /prom/ { return 403; }

    location = /loki/loki/api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass http://$loki/loki/api/v1/query_range$is_args$args;
    }
    location ^~ /loki/ { return 403; }

    location = /nginx.conf { return 404; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
